<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantry Prep</title>
<meta name="description" content="Build and check a 3-day emergency food and water store, as UK Government Be Ready advice recommends.">
<meta name="theme-color" content="#0e7a62">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } body { margin: 0; } img { max-width: 100%; }</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="sub" id="top-sub">Pantry Prep</div>
      <h1 id="top-title">Today</h1>
    </div>
    <button class="pill-btn" id="house-btn" aria-label="Edit household">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      <span id="house-label"></span>
    </button>
  </header>

  <section class="screen" id="screen-home"></section>
  <section class="screen" id="screen-store" hidden></section>
  <section class="screen" id="screen-recipes" hidden></section>
  <section class="screen" id="screen-prepare" hidden></section>
</div>

<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner">
    <button class="tab" data-go="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Dashboard</button>
    <button class="tab" data-go="store">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 9.5h16M4 15h16"/></svg>Store</button>
    <button class="fab" id="fab" aria-label="Add food">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-go="recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 4c0 2 2 2 2 4M14 4c0 2 2 2 2 4"/></svg>Recipes</button>
    <button class="tab" data-go="prepare">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Prepare</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" hidden>
  <div class="sheet-head">
    <div class="grab"></div>
    <div class="sheet-title"><h2 id="sheet-h"></h2><button class="close" id="sheet-close" aria-label="Close">✕</button></div>
    <div id="sheet-extra"></div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
