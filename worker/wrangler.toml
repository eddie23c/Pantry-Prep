# Pantry Prep scan worker: holds the Anthropic key so friends can scan without their own.
# Free Cloudflare Workers plan. Deployed by .github/workflows/scan-worker.yml.
name = "pantry-prep-scan"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Which sites may call the worker (comma separated).
ALLOWED_ORIGINS = "https://eddie23c.github.io,http://localhost:5173,http://localhost:4173"
# Cheapest Claude model that does the job. Switch to claude-sonnet-5-5 if Haiku misses too much.
SCAN_MODEL = "claude-haiku-5-5"
SCAN_EFFORT = "medium"
# Daily limits, counted in photos, reset at midnight UTC.
PHOTOS_PER_SCAN = "3"
DEVICE_DAILY_PHOTOS = "12"
IP_DAILY_PHOTOS = "36"
TOTAL_DAILY_PHOTOS = "300"
# Secrets, set by the deploy workflow (never in this file):
#   ANTHROPIC_API_KEY  - Eddie's key
#   ACCESS_CODE        - optional invite code friends type once; leave unset for no code

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

[observability]
enabled = true
