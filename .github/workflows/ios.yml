name: iPhone app

# Builds the iPhone app on GitHub's free macOS machines (free for public repositories).
# - Every pull request and push to main: a simulator build, to prove the app still compiles.
# - Run by hand ("Run workflow" on the Actions tab): a signed App Store build, uploaded to
#   App Store Connect and TestFlight. Needs the four APPLE_* / ASC_* secrets described in
#   docs/app-store/README.md. No Mac and no certificate files needed: Xcode's cloud signing
#   creates and manages the certificate using the App Store Connect API key.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload a signed build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: ios/App/App.xcodeproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: xcodebuild -version

      - name: Simulator build (no signing)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.upload) }}
        run: |
          xcodebuild -project "$PROJECT" -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80

      - name: Signed archive and upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing. See docs/app-store/README.md."; exit 1; fi
          done
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Build number goes up by one every run; the version shown in the App Store comes from package.json.
          VERSION=$(node -p "require('./package.json').version")
          BUILD="${{ github.run_number }}"

          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}" archive | tail -n 60

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 60
          echo "Uploaded version $VERSION build $BUILD. It appears in App Store Connect > TestFlight after Apple processes it (usually 5 to 30 minutes)." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KEY"
